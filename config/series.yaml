# Series tracked by the dashboard. Adding a series = adding an entry here; no code change.
# Sources below: EVDS (TCMB: loans, CPI, rates), BDDK weekly bulletin, then BKM card statistics.
#
# Allowed values (validated in src/tr_banking/config.py):
#   source:    evds | bddk | bkm | bank_site
#   frequency: daily | weekly | monthly
#   module:    credit | cards | rates | banking | macro (inputs such as CPI, no tab of its own)
#   category:  optional; total | consumer | housing | auto | personal | credit_card |
#              debit_card | commercial | policy | online | foreign | deposits | fx_deposits |
#              household_deposits | commercial_deposits | npl | npl_consumer |
#              npl_commercial | state_banks | private_banks | foreign_banks (one color per category
#              in every dashboard chart; also picks the KPI tiles)
#
# EVDS codes below were verified on 2026-09-24 via the EVDS3 metadata endpoints:
#   category 4502 "Para ve Banka Istatistikleri (Haftalik)"
#   -> datagroup bie_hpbitablo6 "Bankacilik Sektoru Secilmis Kredi Buyuklukleri (Yurt Ici Subeler)"
#   Weekly (Friday), thousand TRY, TRY + FX combined, data starts 2024-06-28.
# The official EVDS label of each series is noted in a comment above it.

series:
  # 1.1.TÜKETİCİ KREDİLERİ / 1.1.CONSUMER LOANS
  - source: evds
    code: TP.HPBITABLO6.2
    name_tr: Tüketici kredileri (toplam)
    name_en: Consumer loans (total)
    unit: thousand TRY
    frequency: weekly
    module: credit
    category: consumer

  # 1.1.1.Konut (TL + YP) / 1.1.1.Housing (TRY + FX)
  - source: evds
    code: TP.HPBITABLO6.3
    name_tr: Konut kredileri
    name_en: Housing loans
    unit: thousand TRY
    frequency: weekly
    module: credit
    category: housing

  # 1.1.2.Taşıt (TL + YP) / 1.1.2.Vehicle (TRY + FX)
  - source: evds
    code: TP.HPBITABLO6.7
    name_tr: Taşıt kredileri
    name_en: Auto loans
    unit: thousand TRY
    frequency: weekly
    module: credit
    category: auto

  # 1.1.3.İhtiyaç (TL + YP) / 1.1.3.Other (TRY + FX)
  - source: evds
    code: TP.HPBITABLO6.11
    name_tr: İhtiyaç kredileri
    name_en: General purpose loans
    unit: thousand TRY
    frequency: weekly
    module: credit
    category: personal

  # 1.1.4.Bireysel Kredi Kartları / 1.1.4.Individual Credit Cards
  - source: evds
    code: TP.HPBITABLO6.16
    name_tr: Bireysel kredi kartları
    name_en: Individual credit cards
    unit: thousand TRY
    frequency: weekly
    module: credit
    category: credit_card

  # 1.2.1.Ticari Krediler / 1.2.1.Commercial Loans (to non-financial corporations)
  - source: evds
    code: TP.HPBITABLO6.20
    name_tr: Ticari krediler
    name_en: Commercial loans
    unit: thousand TRY
    frequency: weekly
    module: credit
    category: commercial

  # Consumer price index, used to deflate TRY values into real values. Data group
  # bie_tukfiy2025 (TUIK), verified 2026-09-27: Tuketici Fiyat Endeksi (2025=100), Genel Endeks,
  # monthly, 2005-01 onward. TUIK already back-cast the new base to 2005, so no own chaining.
  # Published around the 3rd of the next month, hence max_age_days 45 (from the month's end).
  - source: evds
    code: TP.TUKFIY2025.GENEL
    name_tr: Tüketici fiyat endeksi (TÜFE)
    name_en: Consumer price index (CPI)
    unit: index (2025=100)
    frequency: monthly
    module: macro
    max_age_days: 45
    deflator: true

  # Loan interest rates. Data group bie_kt100h "Kredi Faiz Oranlari (Akim)", verified 2026-09-27:
  # weighted average rates banks apply to new TRY loans that week (flow data), weekly (Friday),
  # percent, 2002-01-04 onward (TP.KTF18 from 2012-07-27). Both personal and commercial rates
  # exclude overdrafts (KMH) and corporate cards, whose rates sit near the legal maximum.
  # İhtiyaç Kredisi (TL, Akım, %) - TP.KTF101 would include KMH
  - source: evds
    code: TP.KTF10
    name_tr: İhtiyaç kredisi faizi
    name_en: General purpose loan rate
    unit: "%"
    frequency: weekly
    module: rates
    category: personal

  # Taşıt Kredisi (TL, Akım, %)
  - source: evds
    code: TP.KTF11
    name_tr: Taşıt kredisi faizi
    name_en: Auto loan rate
    unit: "%"
    frequency: weekly
    module: rates
    category: auto

  # Konut Kredisi (TL, Akım, %)
  - source: evds
    code: TP.KTF12
    name_tr: Konut kredisi faizi
    name_en: Housing loan rate
    unit: "%"
    frequency: weekly
    module: rates
    category: housing

  # Ticari Krediler (Tüzel Kişi KMH ve Kurumsal Kredi Kartları Hariç) (TL, Akım, %)
  # TP.KTF17 would include them (about 3 pp higher in 2026).
  - source: evds
    code: TP.KTF18
    name_tr: Ticari kredi faizi
    name_en: Commercial loan rate
    unit: "%"
    frequency: weekly
    module: rates
    category: commercial

  # Policy rate. Data group bie_pyintbnk, "(1H) TCMB Kotasyonlari SATIS (%) (1 Haftalik Islem)":
  # the one-week repo lending rate, business days, 1996-11-04 onward. Its change dates match the
  # MPC (PPK) decisions. No value on holidays, and long holidays last up to 9 days, hence 14 days.
  - source: evds
    code: TP.PY.P02.1H
    name_tr: TCMB politika faizi (1 hafta vadeli repo)
    name_en: CBRT policy rate (one-week repo)
    unit: "%"
    frequency: daily
    module: rates
    category: policy
    max_age_days: 14
    policy_rate: true

# ---------------------------------------------------------------------------------------------
# BDDK weekly bulletin (https://www.bddk.org.tr/BultenHaftalik), table 1 "Krediler".
# Verified on 2026-09-24 from the bulletin page (row ids, bank groups) and its JSON endpoint.
# code = <row id>:<bank group (tarafKodu)>:<currency>:<column>
#   bank groups: 10001 Sektor, 10002 Mevduat, 10003 Kalkinma ve Yatirim, 10004 Katilim,
#                10005 Kamu, 10006 Yabanci, 10007 Yerli Ozel (Kamu+Yabanci+Yerli Ozel = Sektor)
#   currency: TRY | USD; column: 1 = TP (TL), 2 = YP (FX), 3 = Toplam
# Weekly (Friday), million TRY, data starts 2014-01-03.
# Note: BDDK "Tuketici Kredileri" (row 1.0.3) excludes credit cards; row 1.0.2 includes them
# and is the counterpart of EVDS TP.HPBITABLO6.2.

  # 1 Toplam Krediler (2+10)
  - source: bddk
    code: "1.0.1:10001:TRY:3"
    name_tr: Toplam krediler
    name_en: Total loans
    unit: million TRY
    frequency: weekly
    module: credit
    category: total

  # 2 Tüketici Kredileri ve Bireysel Kredi Kartları (3+7)
  - source: bddk
    code: "1.0.2:10001:TRY:3"
    name_tr: Tüketici kredileri (toplam)
    name_en: Consumer loans (total)
    unit: million TRY
    frequency: weekly
    module: credit
    category: consumer

  # 4 a) Konut
  - source: bddk
    code: "1.0.4:10001:TRY:3"
    name_tr: Konut kredileri
    name_en: Housing loans
    unit: million TRY
    frequency: weekly
    module: credit
    category: housing

  # 5 b) Taşıt
  - source: bddk
    code: "1.0.5:10001:TRY:3"
    name_tr: Taşıt kredileri
    name_en: Auto loans
    unit: million TRY
    frequency: weekly
    module: credit
    category: auto

  # 6 c) İhtiyaç
  - source: bddk
    code: "1.0.6:10001:TRY:3"
    name_tr: İhtiyaç kredileri
    name_en: General purpose loans
    unit: million TRY
    frequency: weekly
    module: credit
    category: personal

  # 7 Bireysel Kredi Kartları (8+9)
  - source: bddk
    code: "1.0.8:10001:TRY:3"
    name_tr: Bireysel kredi kartları
    name_en: Individual credit cards
    unit: million TRY
    frequency: weekly
    module: credit
    category: credit_card

  # 10 Ticari ve Diğer Krediler (broader than EVDS "Ticari Krediler" TP.HPBITABLO6.20)
  - source: bddk
    code: "1.0.12:10001:TRY:3"
    name_tr: Ticari ve diğer krediler
    name_en: Commercial and other loans
    unit: million TRY
    frequency: weekly
    module: credit
    category: commercial

# ---------------------------------------------------------------------------------------------
# BDDK weekly bulletin, other tables, module "banking" (the dashboard's "Sektör" tab).
# Verified 2026-09-29: row ids read from the bulletin page's own tables (tabloId 292 Mevduat,
# 290 Takipteki Alacaklar), values equal to the page for 2026-09-18, full history from
# 2014-01-03 (664 weeks), and state + domestic private + foreign = sector, exactly.
# Same code format and units as the loans above: <row>:<bank group>:<currency>:<column>.

  # Mevduat 1: Mevduat (Katılım Fonu) (2+5+8), TOPLAM
  - source: bddk
    code: "4.0.1:10001:TRY:3"
    name_tr: Toplam mevduat
    name_en: Total deposits
    unit: million TRY
    frequency: weekly
    module: banking
    category: deposits

  # Mevduat 1, YP column: the FX part of all deposits, in TRY
  - source: bddk
    code: "4.0.1:10001:TRY:2"
    name_tr: Döviz mevduatı (TL karşılığı)
    name_en: FX deposits (in TRY)
    unit: million TRY
    frequency: weekly
    module: banking
    category: fx_deposits

  # Mevduat 2: Gerçek Kişiler (3+4)
  - source: bddk
    code: "4.0.2:10001:TRY:3"
    name_tr: Gerçek kişi mevduatı
    name_en: Deposits of individuals
    unit: million TRY
    frequency: weekly
    module: banking
    category: household_deposits

  # Mevduat 5: Ticari Kuruluşlar (6+7)
  - source: bddk
    code: "4.0.5:10001:TRY:3"
    name_tr: Ticari kuruluş mevduatı
    name_en: Deposits of companies
    unit: million TRY
    frequency: weekly
    module: banking
    category: commercial_deposits

  # Takipteki Alacaklar 1: Takipteki Alacaklar (2+8)
  - source: bddk
    code: "2.0.1:10001:TRY:3"
    name_tr: Takipteki alacaklar
    name_en: Non-performing loans
    unit: million TRY
    frequency: weekly
    module: banking
    category: npl

  # Takipteki Alacaklar 2: Tüketici Kredileri ve Bireysel Kredi Kartları (3+7)
  # (lists 18.12.2020 and 5.02.2021 twice with the same value; the parser keeps one)
  - source: bddk
    code: "2.0.9:10001:TRY:3"
    name_tr: Takipteki tüketici kredileri ve kartlar
    name_en: Non-performing consumer loans and cards
    unit: million TRY
    frequency: weekly
    module: banking
    category: npl_consumer

  # Takipteki Alacaklar 8: Ticari ve Diğer Krediler
  - source: bddk
    code: "2.0.5:10001:TRY:3"
    name_tr: Takipteki ticari ve diğer krediler
    name_en: Non-performing commercial and other loans
    unit: million TRY
    frequency: weekly
    module: banking
    category: npl_commercial

  # Krediler 1: Toplam Krediler, by bank group (10005 state, 10007 domestic private, 10006 foreign)
  - source: bddk
    code: "1.0.1:10005:TRY:3"
    name_tr: "Toplam krediler: kamu bankaları"
    name_en: "Total loans: state banks"
    unit: million TRY
    frequency: weekly
    module: banking
    category: state_banks

  - source: bddk
    code: "1.0.1:10007:TRY:3"
    name_tr: "Toplam krediler: yerli özel bankalar"
    name_en: "Total loans: domestic private banks"
    unit: million TRY
    frequency: weekly
    module: banking
    category: private_banks

  - source: bddk
    code: "1.0.1:10006:TRY:3"
    name_tr: "Toplam krediler: yabancı bankalar"
    name_en: "Total loans: foreign banks"
    unit: million TRY
    frequency: weekly
    module: banking
    category: foreign_banks

  # Mevduat 1: Toplam mevduat, by bank group
  - source: bddk
    code: "4.0.1:10005:TRY:3"
    name_tr: "Toplam mevduat: kamu bankaları"
    name_en: "Total deposits: state banks"
    unit: million TRY
    frequency: weekly
    module: banking
    category: state_banks

  - source: bddk
    code: "4.0.1:10007:TRY:3"
    name_tr: "Toplam mevduat: yerli özel bankalar"
    name_en: "Total deposits: domestic private banks"
    unit: million TRY
    frequency: weekly
    module: banking
    category: private_banks

  - source: bddk
    code: "4.0.1:10006:TRY:3"
    name_tr: "Toplam mevduat: yabancı bankalar"
    name_en: "Total deposits: foreign banks"
    unit: million TRY
    frequency: weekly
    module: banking
    category: foreign_banks

# ---------------------------------------------------------------------------------------------
# BKM monthly card statistics (https://bkm.com.tr/secilen-aya-ait-istatistikler/), module 2.
# Verified 2026-09-27 on the pages of 2017-01, 2021-03 and 2026-07 (same labels every month).
# Monthly, 2017-01 onward, published about 1.5 to 2 months after the month ends, hence
# max_age_days 100 (from the month's end). Amounts in million TL, card counts in cards.
# code = cards:<card> | txn:<card>:<usage>:<measure>:<kind> | vpos:<channel>:<measure>
# (label mapping in src/tr_banking/sources/bkm.py; credit+debit sums both card types).

  # İşlem tutarı (Milyon TL) / Alışveriş / Kredi Kartı / Yerli Kartların Yurt İçi Kullanımı
  - source: bkm
    code: "txn:credit:domestic:amount:shopping"
    name_tr: Kredi kartıyla alışveriş (yurt içi)
    name_en: Credit card spending (domestic)
    unit: million TRY
    frequency: monthly
    module: cards
    category: credit_card
    max_age_days: 100

  # İşlem tutarı (Milyon TL) / Alışveriş / Banka Kartı / Yerli Kartların Yurt İçi Kullanımı
  - source: bkm
    code: "txn:debit:domestic:amount:shopping"
    name_tr: Banka kartıyla alışveriş (yurt içi)
    name_en: Debit card spending (domestic)
    unit: million TRY
    frequency: monthly
    module: cards
    category: debit_card
    max_age_days: 100

  # Sanal POS İşlemleri / İnternetten Kartlı Ödemeler / İşlem tutarı (Milyon TL)
  - source: bkm
    code: "vpos:internet:amount"
    name_tr: İnternetten kartlı ödemeler
    name_en: Online card payments
    unit: million TRY
    frequency: monthly
    module: cards
    category: online
    max_age_days: 100

  # İşlem tutarı (Milyon TL) / Alışveriş / Yabancı Kartların Yurt İçi Kullanımı, kredi + banka
  # kartı toplamı: a tourism signal
  - source: bkm
    code: "txn:credit+debit:foreign:amount:shopping"
    name_tr: Yabancı kartlarla alışveriş (Türkiye'de)
    name_en: Foreign card spending in Türkiye
    unit: million TRY
    frequency: monthly
    module: cards
    category: foreign
    max_age_days: 100

  # KART SAYILARI / Toplam Kredi Kartı
  - source: bkm
    code: "cards:credit"
    name_tr: Kredi kartı sayısı
    name_en: Number of credit cards
    unit: cards
    frequency: monthly
    module: cards
    category: credit_card
    max_age_days: 100

  # KART SAYILARI / Toplam Banka Kartı
  - source: bkm
    code: "cards:debit"
    name_tr: Banka kartı sayısı
    name_en: Number of debit cards
    unit: cards
    frequency: monthly
    module: cards
    category: debit_card
    max_age_days: 100
